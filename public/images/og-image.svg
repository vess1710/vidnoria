<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#1A1040"/>
    </linearGradient>
    <linearGradient id="ogBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="ogWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="ogGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  
  <!-- Decorative grid dots -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="white"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Ambient glow circles -->
  <circle cx="400" cy="250" r="200" fill="#3B82F6" opacity="0.06" filter="url(#glowFilter)"/>
  <circle cx="800" cy="380" r="180" fill="#8B5CF6" opacity="0.06" filter="url(#glowFilter)"/>
  
  <!-- Top decorative line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#ogBrandGrad)"/>

  <!-- Logo symbol - larger version centered -->
  <g transform="translate(510, 180) scale(2.5)">
    <path d="M2 6 L14 34 L18 26 L15 20 L20 10 L24 20 L21 26 L26 34 L38 6" 
          stroke="url(#ogBrandGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="32" y1="14" x2="36" y2="14" stroke="url(#ogWaveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <line x1="34" y1="8" x2="39" y2="8" stroke="url(#ogWaveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="34" y1="20" x2="39" y2="20" stroke="url(#ogWaveGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="360" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#F1F5F9" filter="url(#textGlow)">
    Vid<tspan fill="url(#ogBrandGrad)">noria</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="410" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" letter-spacing="4" fill="#94A3B8">
    PASTE · CHOOSE · DOWNLOAD
  </text>

  <!-- Subtitle -->
  <text x="600" y="460" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#64748B">
    Video &amp; Music Downloader
  </text>

  <!-- Bottom decorative line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#ogBrandGrad)"/>
</svg>